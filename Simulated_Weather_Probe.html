<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KFFC Virtual Weather Probe Field Log</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6">
    <div class="max-w-2xl mx-auto space-y-6">
        
        <!-- Header Section -->
        <div class="bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700 flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold text-sky-400">KFFC Field Probe (Virtual)</h1>
                <p class="text-xs text-slate-400 mt-1">Status: <span id="probe-status" class="text-emerald-400 font-semibold">Online & Ready</span></p>
            </div>
            <button onclick="takeReading()" class="bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold px-4 py-2.5 rounded-xl shadow-lg transition transform active:scale-95 flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
                Check Reading
            </button>
        </div>

        <!-- Live Metrics Card -->
        <div class="grid grid-cols-2 gap-4">
            <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700">
                <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Barometric Pressure</p>
                <p id="current-pressure" class="text-2xl font-black text-white mt-2">-- inHg</p>
                <p id="current-mb" class="text-xs text-slate-400 mt-1">-- mb</p>
            </div>
            <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700">
                <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Wind Speed & Dir</p>
                <p id="current-wind" class="text-2xl font-black text-white mt-2">-- mph</p>
                <p id="current-dir" class="text-xs text-slate-400 mt-1">Direction: --</p>
            </div>
        </div>

        <!-- Log Document View -->
        <div class="bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-sm font-bold tracking-wide uppercase text-slate-300">Field Log Document Sheet</h2>
                <span class="text-xs bg-slate-700 text-slate-300 px-2.5 py-1 rounded-md">Auto-appending</span>
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="border-b border-slate-700 text-slate-400">
                            <th class="py-2.5 px-3">Timestamp</th>
                            <th class="py-2.5 px-3">Pressure</th>
                            <th class="py-2.5 px-3">Wind</th>
                            <th class="py-2.5 px-3">Status</th>
                        </tr>
                    </thead>
                    <tbody id="log-table-body" class="divide-y divide-slate-700/50">
                        <!-- Dynamic logs appear here -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        const directions = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];

        function getRandomFloat(min, max, decimals) {
            const str = (Math.random() * (max - min) + min).toFixed(decimals);
            return parseFloat(str);
        }

        function takeReading() {
            // Simulate probe data calculation
            const inHg = getRandomFloat(29.80, 30.25, 2);
            const mb = (inHg * 33.8639).toFixed(1);
            const windMph = getRandomFloat(1.5, 16.0, 1);
            const windDir = directions[Math.floor(Math.random() * directions.length)];
            
            const now = new Date();
            const timestamp = now.toLocaleTimeString() + ' ' + now.toLocaleDateString();

            // Update UI blocks
            document.getElementById('current-pressure').innerText = `${inHg} inHg`;
            document.getElementById('current-mb').innerText = `${mb} mb`;
            document.getElementById('current-wind').innerText = `${windMph} mph`;
            document.getElementById('current-dir').innerText = `Direction: ${windDir}`;

            // Add row to log document sheet table
            const tbody = document.getElementById('log-table-body');
            const row = document.createElement('tr');
            row.innerHTML = `
                <td class="py-3 px-3 text-slate-300">${timestamp}</td>
                <td class="py-3 px-3 font-medium text-sky-300">${inHg} inHg</td>
                <td class="py-3 px-3 text-slate-300">${windMph} mph (${windDir})</td>
                <td class="py-3 px-3"><span class="bg-emerald-500/10 text-emerald-400 text-xs px-2 py-0.5 rounded font-medium">Logged</span></td>
            `;
            
            // Insert at top of table
            tbody.insertBefore(row, tbody.firstChild);
        }

        // Run an initial reading on load
        window.onload = () => {
            takeReading();
        };
    </script>
</body>
</html>
